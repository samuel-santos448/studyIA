# Replace studyia.example.com before copying. Certbot adds TLS and redirects.
limit_req_zone $binary_remote_addr zone=studyia_login:10m rate=5r/m;
server {
    listen 80;
    server_name studyia.example.com;
    client_max_body_size 1m;

    # Bootstrap the administrator through localhost before public access.
    location = /api/company/setup { return 403; }
    location = /api/company/login {
        limit_req zone=studyia_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
