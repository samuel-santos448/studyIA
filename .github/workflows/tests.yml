name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: studyia_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: studyia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U studyia_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://studyia_test:local-test-only@127.0.0.1:5432/studyia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
